<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="spaceVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c182b"/>
      <stop offset="45%" stop-color="#070c18"/>
      <stop offset="80%" stop-color="#04060a"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <radialGradient id="coreApertureGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for 3D Crystal W and Fractal Filaments -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="purpleFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <linearGradient id="goldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="emeraldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="spineWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="ringOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="33%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="66%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for High-Precision Quantum Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseLaserGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate Void -->
  <rect width="800" height="800" rx="160" fill="url(#spaceVoid)"/>
  <rect width="800" height="800" rx="160" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2"/>
  <circle cx="400" cy="400" r="380" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>

  <!-- Core Diffuse Glow -->
  <circle cx="400" cy="400" r="320" fill="url(#coreApertureGlow)"/>

  <!-- ======================================================== -->
  <!-- 1. TELEMETRY RADAR & 3 ZOOM PLANE ORBIT RINGS (FNS CORE) -->
  <!-- ======================================================== -->
  <!-- Plane 3: 1.60x Outer Boundary Ring (r = 310) -->
  <circle cx="400" cy="400" r="310" fill="none" stroke="url(#ringOrbitGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 8"/>
  <circle cx="400" cy="400" r="310" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Plane 2: 1.00x Canonical Resonance Ring (r = 230) -->
  <circle cx="400" cy="400" r="230" fill="none" stroke="url(#ringOrbitGrad)" stroke-width="2.5" stroke-opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="400" cy="400" r="230" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Plane 1: 0.60x Core Tripod Horizon (r = 150) -->
  <circle cx="400" cy="400" r="150" fill="none" stroke="url(#ringOrbitGrad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="12 6 3 6"/>

  <!-- Telemetry Coordinate Axis & Harmonic Ticks -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="1">
    <!-- 12 Evaluation Tick Marks (Z mod 9 & Orthogonal Planes) -->
    <line x1="400" y1="75" x2="400" y2="95"/>
    <line x1="400" y1="705" x2="400" y2="725"/>
    <line x1="75" y1="400" x2="95" y2="400"/>
    <line x1="705" y1="400" x2="725" y2="400"/>
    
    <!-- 30/60 degree diagonal precision ticks -->
    <line x1="170" y1="267" x2="187" y2="277"/>
    <line x1="630" y1="267" x2="613" y2="277"/>
    <line x1="170" y1="533" x2="187" y2="523"/>
    <line x1="630" y1="533" x2="613" y2="523"/>

    <line x1="267" y1="170" x2="277" y2="187"/>
    <line x1="533" y1="170" x2="523" y2="187"/>
    <line x1="267" y1="630" x2="277" y2="613"/>
    <line x1="533" y1="630" x2="523" y2="613"/>
  </g>

  <!-- Sub-ring Radar Markings -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" fill="rgba(255, 255, 255, 0.35)" letter-spacing="1">
    <text x="408" y="93" text-anchor="start">0.60x</text>
    <text x="408" y="173" text-anchor="start">1.00x</text>
    <text x="408" y="253" text-anchor="start">1.60x</text>
    <text x="695" y="396" text-anchor="end">∂M RESONANCE</text>
    <text x="105" y="396" text-anchor="start">Z/9Z MODULAR</text>
  </g>

  <!-- ======================================================== -->
  <!-- 2. FRACTAL ESCAPE DYNAMICS & SYNAPTIC AXON FILAMENTS     -->
  <!-- ======================================================== -->
  <!-- Dynamic Golden Spiral & Cardioid Horizon Ribbons -->
  <!-- Left Outer Synaptic Streamline (Emerald -> Cyan) -->
  <path d="M 400,160 C 270,160 170,260 170,390 C 170,480 230,580 340,620 C 370,630 400,610 400,580 C 400,520 280,480 280,390 C 280,310 330,240 400,240" 
        fill="none" stroke="url(#cyanFacet)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85" filter="url(#softGlow)"/>

  <!-- Right Outer Synaptic Streamline (Purple -> Gold) -->
  <path d="M 400,160 C 530,160 630,260 630,390 C 630,480 570,580 460,620 C 430,630 400,610 400,580 C 400,520 520,480 520,390 C 520,310 470,240 400,240" 
        fill="none" stroke="url(#purpleFacet)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85" filter="url(#softGlow)"/>

  <!-- Micro Fiber-Optic Traveling Synapse Pulses -->
  <path d="M 400,160 Q 300,280 240,460 Q 330,520 400,490 Q 470,520 560,460 Q 500,280 400,160"
        fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" stroke-dasharray="8 16" stroke-linecap="round"/>

  <!-- Central Orbital Loop: z_{n+1} = z_n^2 + c Escape Knot -->
  <path d="M 400,270 C 350,270 310,320 310,380 C 310,450 400,530 400,530 C 400,530 490,450 490,380 C 490,320 450,270 400,270 Z"
        fill="none" stroke="url(#ringOrbitGrad)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- ======================================================== -->
  <!-- 3. THE 3D CHISELED CRYSTAL "W" CROWN (WERR CORPUS CORE) -->
  <!-- ======================================================== -->
  <!-- The Emblem Centerpiece: 3 Rising Apexes, 2 Lower Prisms, Vertical Chisel Spine -->
  <g filter="url(#intenseLaserGlow)">
    <!-- Left Wing Outer Facet (Cyan Deep) -->
    <polygon points="400,240 330,360 250,280 300,480 400,540" 
             fill="url(#cyanFacet)" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Left Wing Inner Reflective Facet (Cyan Ice-White) -->
    <polygon points="400,240 400,540 330,440 330,360" 
             fill="#38bdf8" fill-opacity="0.75" stroke="#e0f2fe" stroke-width="1"/>

    <!-- Right Wing Outer Facet (Royal Violet & Imperial Gold) -->
    <polygon points="400,240 470,360 550,280 500,480 400,540" 
             fill="url(#purpleFacet)" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Right Wing Inner Reflective Facet (Violet Highlight) -->
    <polygon points="400,240 400,540 470,440 470,360" 
             fill="#a855f7" fill-opacity="0.75" stroke="#fdf4ff" stroke-width="1"/>

    <!-- Dual Lower Prism Refraction Triangles -->
    <polygon points="300,480 400,540 350,590" fill="#0369a1" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="500,480 400,540 450,590" fill="#6b21a8" fill-opacity="0.9" stroke="#c084fc" stroke-width="1"/>

    <!-- Central Vertical Razor Chisel Spine (Pure Laser White) -->
    <line x1="400" y1="230" x2="400" y2="570" stroke="url(#spineWhite)" stroke-width="3" stroke-linecap="round"/>
    <line x1="400" y1="235" x2="400" y2="550" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- ======================================================== -->
  <!-- 4. THE 3 HARMONIC TRIPOD RESONANCE NODES (Z/9Z MODULAR)  -->
  <!-- ======================================================== -->
  <!-- Node 0: Top White/Cyan Apex Node (r = 160, angle = -90 deg -> (400, 160)) -->
  <g transform="translate(400, 160)" filter="url(#nodeGlow)">
    <circle cx="0" cy="0" r="18" fill="url(#cyanFacet)"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <!-- Specular Diamond Sparkle -->
    <path d="M 0,-24 L 3,-6 L 24,0 L 3,6 L 0,24 L -3,6 L -24,0 L -3,-6 Z" fill="#ffffff"/>
  </g>

  <!-- Node 3: Bottom-Right Amber/Gold Node (r = 240, angle = 30 deg -> (608, 520)) -->
  <g transform="translate(580, 480)" filter="url(#nodeGlow)">
    <circle cx="0" cy="0" r="16" fill="url(#goldFacet)"/>
    <circle cx="0" cy="0" r="12" fill="#fef08a" fill-opacity="0.95"/>
    <circle cx="0" cy="0" r="5" fill="#d97706"/>
    <!-- Specular Diamond Sparkle -->
    <path d="M 0,-18 L 2,-4 L 18,0 L 2,4 L 0,18 L -2,4 L -18,0 L -2,-4 Z" fill="#ffffff"/>
  </g>

  <!-- Node 6: Bottom-Left Bio-Emerald Node (r = 240, angle = 150 deg -> (192, 520)) -->
  <g transform="translate(220, 480)" filter="url(#nodeGlow)">
    <circle cx="0" cy="0" r="16" fill="url(#emeraldFacet)"/>
    <circle cx="0" cy="0" r="12" fill="#a7f3d0" fill-opacity="0.95"/>
    <circle cx="0" cy="0" r="5" fill="#059669"/>
    <!-- Specular Diamond Sparkle -->
    <path d="M 0,-18 L 2,-4 L 18,0 L 2,4 L 0,18 L -2,4 L -18,0 L -2,-4 Z" fill="#ffffff"/>
  </g>

  <!-- Secondary Crown Tip Sparkles -->
  <g transform="translate(250, 280)">
    <path d="M 0,-14 L 2,-3 L 14,0 L 2,3 L 0,14 L -2,3 L -14,0 L -2,-3 Z" fill="#e0f2fe" filter="url(#softGlow)"/>
  </g>
  <g transform="translate(550, 280)">
    <path d="M 0,-14 L 2,-3 L 14,0 L 2,3 L 0,14 L -2,3 L -14,0 L -2,-3 Z" fill="#fdf4ff" filter="url(#softGlow)"/>
  </g>
  <g transform="translate(400, 590)">
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#softGlow)"/>
  </g>

  <!-- ======================================================== -->
  <!-- 5. TYPOGRAPHIC ARC & MATHEMATICAL EMBLEM INSCRIPTION     -->
  <!-- ======================================================== -->
  <!-- Lower Scientific Brand Label -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif">
    <text x="400" y="695" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="6">
      FRACTAL NEURAL SYNTHESIS
    </text>
    <text x="400" y="725" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="3">
      ZERO-STORAGE PROCEDURAL WEIGHT DERIVATION &#8226; WERR CORPUS
    </text>
    <text x="400" y="748" font-size="9" font-family="'JetBrains Mono', Consolas, monospace" font-weight="500" fill="rgba(255, 255, 255, 0.45)" letter-spacing="1.5">
      O(1) MEMORY &#8226; &lt; 0.04 ms LATENCY &#8226; LEAN 4 MACHINE-CERTIFIED
    </text>
  </g>
</svg>
