<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerBg" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c182b"/>
      <stop offset="45%" stop-color="#070c18"/>
      <stop offset="85%" stop-color="#04060a"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>
    
    <radialGradient id="apertureGlow" cx="200" cy="200" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="violetFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect width="1200" height="400" rx="20" fill="url(#bannerBg)"/>
  <rect width="1200" height="400" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

  <!-- Subtle Horizon Grid -->
  <line x1="0" y1="340" x2="1200" y2="340" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <line x1="420" y1="50" x2="420" y2="340" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Left: Emblem Glow & Concentric Rings -->
  <circle cx="210" cy="200" r="170" fill="url(#apertureGlow)"/>
  <circle cx="210" cy="200" r="145" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="210" cy="200" r="105" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="2"/>
  <circle cx="210" cy="200" r="68" fill="none" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" stroke-dasharray="8 4 2 4"/>

  <!-- Emblem Fractal Synaptic Curves -->
  <g transform="translate(210, 200) scale(0.48) translate(-400, -400)">
    <!-- Left Ribbon -->
    <path d="M 400,160 C 270,160 170,260 170,390 C 170,480 230,580 340,620 C 370,630 400,610 400,580 C 400,520 280,480 280,390 C 280,310 330,240 400,240" 
          fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#laserGlow)"/>
    <!-- Right Ribbon -->
    <path d="M 400,160 C 530,160 630,260 630,390 C 630,480 570,580 460,620 C 430,630 400,610 400,580 C 400,520 520,480 520,390 C 520,310 470,240 400,240" 
          fill="none" stroke="#c084fc" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#laserGlow)"/>

    <!-- Central 3D Crystal W Crown -->
    <polygon points="400,240 330,360 250,280 300,480 400,540" fill="url(#cyanFacet)" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="400,240 470,360 550,280 500,480 400,540" fill="url(#violetFacet)" stroke="#c084fc" stroke-width="3"/>
    <polygon points="400,240 400,540 330,440 330,360" fill="#38bdf8" fill-opacity="0.8"/>
    <polygon points="400,240 400,540 470,440 470,360" fill="#a855f7" fill-opacity="0.8"/>
    <line x1="400" y1="230" x2="400" y2="560" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- 3 Tripod Nodes -->
    <circle cx="400" cy="160" r="26" fill="#ffffff" filter="url(#laserGlow)"/>
    <circle cx="580" cy="480" r="24" fill="#fbbf24" filter="url(#laserGlow)"/>
    <circle cx="220" cy="480" r="24" fill="#10b981" filter="url(#laserGlow)"/>
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(460, 0)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="65" width="460" height="26" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">
      🏛️ ÇUKUROVA ÜNİVERSİTESİ TEKNOKENT &#8226; ITOUCH BİLİŞİM SİSTEMLERİ
    </text>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="1">
      FRACTAL NEURAL SYNTHESIS
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f1f5f9" letter-spacing="0.5">
      Zero-Storage Procedural Weight Derivation &amp; Formal Reflexes
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Eliminating static multi-gigabyte weight matrices via closed-form dynamical boundary dynamics.
    </text>
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Deriving non-linear decision hyperplanes with O(1) memory and &lt; 0.04 ms deterministic latency.
    </text>

    <!-- Technical Parameter Tags -->
    <g transform="translate(0, 275)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">
      <!-- Tag 1: WERR Corpus -->
      <rect x="0" y="0" width="125" height="24" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <text x="10" y="16" fill="#38bdf8">⚡ WERR CORPUS</text>

      <!-- Tag 2: Zero VRAM -->
      <rect x="135" y="0" width="135" height="24" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
      <text x="145" y="16" fill="#10b981">🧠 0 BYTES VRAM</text>

      <!-- Tag 3: Lean 4 -->
      <rect x="280" y="0" width="145" height="24" rx="4" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
      <text x="290" y="16" fill="#c084fc">📐 LEAN 4 (0 SORRY)</text>

      <!-- Tag 4: Patent TR -->
      <rect x="435" y="0" width="155" height="24" rx="4" fill="rgba(251, 191, 36, 0.12)" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1"/>
      <text x="445" y="16" fill="#fbbf24">📜 TR 2026/016285</text>
    </g>
  </g>

  <!-- Bottom Telemetry Ticker -->
  <g transform="translate(460, 368)" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="rgba(255, 255, 255, 0.45)">
    <text x="0" y="0">ORBIT ENGINE: z_{n+1} = z_n^2 + c</text>
    <text x="230" y="0">&#8226; Z/9Z TRIPOD RESONANCE</text>
    <text x="440" y="0">&#8226; W = 176,906,915 (-377K WIRES)</text>
  </g>
</svg>
